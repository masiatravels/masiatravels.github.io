<style>
/* ---------- THEMES ---------- */
:root, [data-theme="1"]{
  --bg:#f6f1e9; --card:#ffffff; --soft:#faf6f0; --line:#e8dfd2;
  --ink:#16213e; --text:#3b4256; --muted:#7c7f8c;
  --accent:#b8975f; --accent-soft:#f1e7d6;
  --dark:#16213e; --dark-text:#fff;
  --head:'Rubik',sans-serif; --body:'Heebo',sans-serif;
  --radius:22px; --shadow:0 10px 30px -18px rgba(22,33,62,.35);
}
[data-theme="2"]{
  --bg:#0d1424; --card:#151f35; --soft:#1b2742; --line:#26324f;
  --ink:#f3ead9; --text:#c9cbd4; --muted:#8990a3;
  --accent:#d4b47c; --accent-soft:#2a3350;
  --dark:#d4b47c; --dark-text:#0d1424;
  --head:'Frank Ruhl Libre',serif; --body:'Heebo',sans-serif;
  --radius:18px; --shadow:0 14px 40px -20px rgba(0,0,0,.8);
}
[data-theme="3"]{
  --bg:#ffffff; --card:#ffffff; --soft:#f4f6f9; --line:#e6e9ef;
  --ink:#0f1b33; --text:#3d4558; --muted:#80879a;
  --accent:#c49a54; --accent-soft:#f6eedf;
  --dark:#0f1b33; --dark-text:#fff;
  --head:'Rubik',sans-serif; --body:'Heebo',sans-serif;
  --radius:28px; --shadow:none;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:96px;transition:background .3s}
img{display:block;max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
h1,h2,h3,.num{font-family:var(--head);color:var(--ink)}

/* preview switcher (only for choosing a design) */
.switcher{position:sticky;top:0;z-index:50;display:flex;gap:6px;justify-content:center;align-items:center;padding:8px;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);font:500 13px var(--body);color:#fff}
.switcher button{border:0;border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer;background:rgba(255,255,255,.14);color:#fff}
.switcher button.on{background:#d4b47c;color:#111}

/* header + hero */
header{display:flex;justify-content:center;padding:22px 0 18px}
header img{height:74px;border-radius:10px}
.hero{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);aspect-ratio:4/3.4;max-height:520px;width:100%}
.hero img{width:100%;height:100%;object-fit:cover}
.hero.nophoto{aspect-ratio:auto;min-height:250px;background:radial-gradient(120% 90% at 85% 10%,#2b3a63 0%,#16213e 60%)}
.hero.nophoto img{display:none}
.hero.nophoto .over{position:relative}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,30,0) 35%,rgba(10,16,30,.82) 100%)}
.hero .over{position:absolute;inset:auto 0 0 0;padding:24px 22px;z-index:2;color:#fff}
.eyebrow{display:inline-block;font:700 12px var(--body);letter-spacing:.25em;color:var(--accent);margin-bottom:6px}
.hero .eyebrow{color:#f1d9a8}
.hero h1{color:#fff;font-size:clamp(24px,6.4vw,36px);line-height:1.2;font-weight:800}
[data-theme="2"] .hero h1{font-weight:900}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13.5px;font-weight:500;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.25)}

/* sections */
section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 20px;margin-top:18px;box-shadow:var(--shadow)}
[data-theme="3"] section.card{border:0;border-top:1px solid var(--line);border-radius:0;padding:30px 4px;margin-top:0}
.sec-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;margin-bottom:6px}
.sec-title::before{content:"";width:5px;height:24px;border-radius:9px;background:linear-gradient(var(--accent),var(--ink))}
.sec-sub{color:var(--muted);font-size:15px;margin-bottom:16px}

/* options */
.opts{display:grid;gap:12px}
.opt{position:relative;display:block;cursor:pointer;background:var(--soft);border:2px solid transparent;border-radius:calc(var(--radius) - 6px);padding:18px 18px 16px;transition:.2s}
.opt input{position:absolute;opacity:0}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt .tag{font:700 15px var(--head);color:var(--ink)}
.opt .meta{font-size:14px;color:var(--muted)}
.opt .pp{font-size:34px;font-weight:800;line-height:1.15;margin-top:8px}
.opt .pp small{font-size:17px;font-weight:600}
.opt .cp{font-size:14.5px;color:var(--text)}
.opt .cp b{color:var(--ink)}
.opt .radio{position:absolute;top:18px;left:18px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt.on .radio{border-color:var(--accent);background:var(--accent)}
.opt.on .radio::after{content:"✓";color:#fff;font-size:13px;font-weight:700}
.note{font-size:14px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

/* flights */
.leg{border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-top:12px;background:var(--soft)}
.leg-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--dark);color:var(--dark-text);font:700 13px var(--head);padding:5px 14px;border-radius:99px}
.leg-when{font:700 16px var(--head);color:var(--ink)}
.route{display:flex;align-items:center;gap:10px;margin:12px 0 6px;font:700 17px var(--head);color:var(--ink)}
.route .line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 11px);position:relative}
.route .line::after{content:"✈";position:absolute;top:50%;left:50%;transform:translate(-50%,-55%) scaleX(-1);color:var(--accent);font-size:15px;background:var(--soft);padding:0 4px}
.leg-info{font-size:14px;color:var(--muted)}
.leg-info b{color:var(--text);font-weight:600}
.bag{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:14.5px;font-weight:500}

/* hotels */
.h-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14.5px;color:var(--muted);margin-bottom:12px}
.stars{color:var(--accent);letter-spacing:2px}
.rating{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.score{background:var(--dark);color:var(--dark-text);font:800 18px var(--head);border-radius:12px 12px 12px 3px;padding:6px 10px;min-width:52px;text-align:center}
.rating b{display:block;color:var(--ink);font-size:15px}
.rating span{font-size:13.5px;color:var(--muted)}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -20px;padding:0 20px 6px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal figure{position:relative;flex:0 0 84%;scroll-snap-align:center;border-radius:16px;overflow:hidden;aspect-ratio:4/3;cursor:zoom-in}
.gal figure:only-child{flex-basis:100%}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gal figure:hover img{transform:scale(1.04)}
.gal figcaption{position:absolute;bottom:0;inset-inline:0;padding:22px 12px 8px;font-size:13px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.dots{display:flex;justify-content:center;gap:5px;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line)}
.near{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 4px}
.near div{background:var(--soft);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.35}
.near div b{display:block;color:var(--ink);font-family:var(--head);font-size:15px}
ul.dots-list{list-style:none;margin-top:12px}
ul.dots-list li{position:relative;padding:5px 22px 5px 0;font-size:15.5px}
ul.dots-list li::before{content:"";position:absolute;right:4px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.info-box{margin-top:12px;padding:13px 15px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:14.5px;line-height:1.6}
.info-box.about{background:var(--soft);color:var(--text)}
.info-box b{color:var(--ink)}
.policy{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 13px}

/* itinerary */
.tl{position:relative;margin-top:8px}
.tl::before{content:"";position:absolute;right:58px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl-row{display:grid;grid-template-columns:52px 1fr;gap:22px;padding:9px 0;position:relative}
.tl-row::before{content:"";position:absolute;right:53px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.tl-d{font:800 14.5px var(--head);color:var(--ink);text-align:left;direction:ltr;white-space:nowrap}
.tl-t{font-size:15px}

/* incl */
.incl li::before{content:"✓"!important;background:none!important;color:var(--accent);font-weight:800;top:4px!important;right:2px!important;width:auto!important;height:auto!important}
.excl{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.excl h3{font-size:17px;margin-bottom:6px}
.excl p{font-size:14.5px;color:var(--muted)}

/* total */
.total{margin-top:18px;border-radius:var(--radius);padding:28px 22px;text-align:center;background:var(--dark);color:var(--dark-text);box-shadow:var(--shadow)}
.total .lbl{font-size:15px;opacity:.85}
.total .big{font:800 clamp(42px,12vw,58px)/1.1 var(--head);color:var(--dark-text);margin:6px 0}
.total .pp{font:700 17px var(--head)}
.total p{font-size:14px;opacity:.85;margin-top:10px}
.total hr{border:0;border-top:1px solid currentColor;opacity:.2;margin:18px 0}
.pay{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:10px}
.pay span{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid currentColor;opacity:.9}
.valid{text-align:center;margin-top:16px;font-size:14.5px;color:var(--muted)}
.valid b{color:var(--ink)}

/* CTA */
.cta{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 8px;max-width:520px;background:#25a35a;color:#fff;text-decoration:none;font:800 19px var(--head);padding:16px 22px;border-radius:99px;box-shadow:0 12px 28px -12px rgba(37,163,90,.7)}
.cta .p{background:rgba(255,255,255,.2);padding:4px 12px;border-radius:99px;font-size:16px}
.cta svg{width:26px;height:26px;flex:none}
.ltr{unicode-bidi:isolate;white-space:nowrap}
.phone{text-align:center;font:700 15px var(--head);color:var(--ink);direction:rtl}
.phone span{direction:ltr;unicode-bidi:embed}
.sticky{position:fixed;bottom:0;inset-inline:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);transform:translateY(120%);transition:transform .35s}
.sticky.show{transform:none}
.sticky .cta{margin:0 auto;font-size:17px;padding:13px 18px}

footer{margin-top:34px;background:#16213e;color:#d5d9e3;text-align:center;padding:30px 20px 40px;font-size:13.5px}
[data-theme="2"] footer{background:#080d18}
footer .brand{font:700 16px 'Rubik';color:#fff;margin-bottom:4px}
footer p{max-width:560px;margin:4px auto;opacity:.85}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
.lb.on{display:flex}
.lb img{max-height:86vh;border-radius:12px}
.lb button{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;font-size:20px;cursor:pointer}
@media(min-width:700px){.gal figure{flex-basis:62%}.opts{grid-template-columns:1fr 1fr}}
</style>
</head>

  included: ["טיסות ישירות הלוך וחזור תל אביב – אתונה עם סקיי אקספרס","טרולי לכל נוסע","4 לילות בחדר זוגי במלון בוטיק ליד כיכר סינטגמה (לינה בלבד)","ביטול חינם עד 2.12.2026","ליווי אישי שלנו מההזמנה ועד הנחיתה"],
  excluded: "ארוחות — המחיר ללא ארוחת בוקר · מזוודה רשומה · העברות משדה התעופה למלון · ביטוח נסיעות · כניסה לאתרים · מס עירוני במלון (משולם במקום)",
  totalNote: "המחיר לזוג בחדר זוגי, כולל טיסות ישירות הלוך וחזור, טרולי לכל נוסע ו־4 לילות במלון בוטיק בלב אתונה (לינה בלבד).",
  pay: ["עד 9 תשלומים ללא ריבית","אפשרות ביותר מכרטיס אשראי אחד","העברה בנקאית","מזומן לפי חוק המזומן בישראל"],
  terms: ["המחיר בכפוף לזמינות בעת ההזמנה.","המחיר לזוג החולק חדר זוגי, לינה בלבד.","ביטול חינם עד 2.12.2026, לאחר מכן ההזמנה אינה ניתנת לביטול.","הדרכון חייב להיות בתוקף לפחות חצי שנה אחרי תאריך החזרה.","שעות הטיסה סופיות רק לאחר אישור ההזמנה."]
};
/* ========================================================================== */

const $ = id => document.getElementById(id);
const nis = n => "₪" + n.toLocaleString("en-US");
const esc0 = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* keep number ranges like 6.5–24.5.2027 or 15:15–16:50 in reading order inside RTL text */
const esc = s => esc0(s).replace(/\d[\d.:]*\s*[–-]\s*\d[\d.:]*/g, m => `<span dir="ltr" class="ltr">${m}</span>`);
let sel = 0;
const PAX = Q.pax || 2, PAXL = PAX===2 ? "לזוג" : "ל־" + PAX + " נוסעים";

if (Q.hero) $("heroImg").src = "img/" + Q.hero; else document.querySelector(".hero").classList.add("nophoto");
$("title").textContent = Q.title;
$("chips").innerHTML = Q.chips.map(c => `<span class="chip">${esc(c)}</span>`).join("");
$("optsTitle").textContent = Q.optionsTitle;
$("optsNote").innerHTML = esc(Q.optionsNote);
if (Q.options.length < 2) $("optsSub").remove();
$("opts").innerHTML = Q.options.map((o,i) => `
  <label class="opt${i===0?' on':''}" data-i="${i}">
    <input type="radio" name="opt" ${i===0?'checked':''}>
    <span class="radio"></span>
    <div class="tag">${esc(o.tag)}</div>
    <div class="meta">${esc(o.meta)}</div>
    <div class="pp num">${nis(o.pp)} <small>לאדם</small></div>
    <div class="cp">סה״כ ${PAXL} <b>${nis(o.pp*PAX)}</b></div>
  </label>`).join("");

$("flightsIntro").innerHTML = esc(Q.flightsIntro);
$("legs").innerHTML = Q.legs.map(l => `
  <div class="leg">
    <div class="leg-top"><span class="badge">${esc(l.badge)}</span><span class="leg-when">${esc(l.date)} · המראה ${esc(l.time)}</span></div>
    <div class="route"><span>${esc(l.from)}</span><span class="line"></span><span>${esc(l.to)}</span></div>
    <div class="leg-info"><b>${esc(l.airline)}</b> · ${esc(l.info)}</div>
  </div>`).join("");
$("bag").textContent = Q.bag;

$("hotels").innerHTML = Q.hotels.map(h => `
  <section class="card">
    <h2 class="sec-title">${esc(h.place)}</h2>
    <div class="h-meta">${h.stars?`<span class="stars">${"★".repeat(h.stars)}</span><span>${h.stars} כוכבים · ${esc(h.where)}</span>`:`<span>${esc(h.where)}</span>`}<span>${h.nights} לילות · ${esc(h.dates)}</span></div>
    <div class="rating"><div class="score">${esc(h.score)}</div><div><b>${esc(h.scoreWord)}${Q.demoRatings?" <small style=\"color:var(--accent)\">(דירוג לדוגמה)</small>":""}</b><span>על סמך ${esc(h.reviews)} חוות דעת של אורחים</span></div></div>
    ${h.photos.length?`<div class="gal">${h.photos.map(p => `<figure><img loading="lazy" src="img/${p[0]}" alt="${esc0(p[1])}"><figcaption>${esc(p[1])}</figcaption></figure>`).join("")}</div>`:""}
    ${h.photos.length>1?`<div class="dots">${h.photos.map(()=>"<i></i>").join("")}</div>`:""}
    ${h.room?`<div class="info-box">${h.room}</div>`:""}
    ${h.about?`<div class="info-box about">${h.about}</div>`:""}
    <div class="near">${h.near.map(n => `<div><b>${esc(n[0])}</b>${esc(n[1])}</div>`).join("")}</div>
    <ul class="dots-list">${h.bullets.map(b => `<li>${esc(b)}</li>`).join("")}</ul>
    ${Q.policy?`<span class="policy">ℹ️ ${esc(Q.policy)}</span>`:""}
  </section>`).join("");

$("tl").innerHTML = Q.itinerary.map(r => `<div class="tl-row"><div class="tl-d">${esc(r[0])}</div><div class="tl-t">${esc(r[1])}</div></div>`).join("");
$("incl").innerHTML = Q.included.map(x => `<li>${esc(x)}</li>`).join("");
$("excl").textContent = Q.excluded;
$("totNote").textContent = Q.totalNote;
$("pay").innerHTML = Q.pay.map(x => `<span>${esc(x)}</span>`).join("");
$("valid").textContent = Q.validUntil;
$("phone").textContent = "+" + Q.whatsapp;
$("terms").innerHTML = Q.terms.map(t => `<p>${esc(t)}</p>`).join("");

const waIcon = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>';
function render(){
  const o = Q.options[sel], couple = o.pp*PAX;
  document.querySelectorAll(".opt").forEach((el,i)=>el.classList.toggle("on",i===sel));
  $("totLbl").textContent = "סה״כ " + PAXL + " · " + o.tag.split("·").pop().trim();
  $("totBig").textContent = nis(couple);
  $("totPP").textContent = nis(o.pp) + " לאדם · " + nis(couple) + " " + PAXL;
  const msg = `היי Masia 👋\nאני מעוניין/ת בהצעה: ${Q.title}\n${o.tag}\n${nis(o.pp)} לאדם · ${nis(couple)} ${PAXL}`;
  const href = `https://wa.me/${Q.whatsapp}?text=${encodeURIComponent(msg)}`;
  for (const id of ["cta","cta2"]) { $(id).href = href; $(id).innerHTML = `${waIcon}<span>להזמנה בוואטסאפ</span><span class="p">${nis(couple)}</span>`; }
}
document.querySelectorAll(".opt").forEach(el => el.addEventListener("click", () => { sel = +el.dataset.i; render(); }));
render();

/* sticky CTA after scrolling past the options, hide near the real CTA */
const sticky = $("sticky");
addEventListener("scroll", () => {
  const ctaTop = $("cta").getBoundingClientRect().top;
  sticky.classList.toggle("show", scrollY > 600 && ctaTop > innerHeight);
}, {passive:true});

/* lightbox */
const lb = $("lb");
document.addEventListener("click", e => {
  const f = e.target.closest(".gal figure");
  if (f) { lb.querySelector("img").src = f.querySelector("img").src; lb.classList.add("on"); }
  else if (e.target.closest(".lb")) lb.classList.remove("on");
});

</script>
</body>
</html>
